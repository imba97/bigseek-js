name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      # id-token 是 npm Trusted Publisher（OIDC）的通行证，不需要 NPM_TOKEN
      id-token: write
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        # 不写 version：由 package.json 的 packageManager 单一来源决定
        uses: pnpm/action-setup@v6

      - name: Set node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: npm i -g npm@latest

      - name: Install Dependencies
        # 锁文件已提交：发布构建必须可复现，不用 --no-frozen-lockfile
        run: pnpm i --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Publish to NPM
        run: pnpm publish --access public --no-git-checks --provenance

      # changelog 放在发布**之后**：否则测试/构建/发布任一失败都会留下
      # 「GitHub Release 已建、npm 却没发」的不一致状态。
      # 固定大版本：带 contents: write 与 id-token: write 的 job 里不该跑未固定版本的代码。
      - name: Create GitHub Release
        run: npx changelogithub@15
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
